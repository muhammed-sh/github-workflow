name: github-workflow

on: "push"

env: 
  ARTIFICATE_NAME: test

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      use: actions/checkout@v2
  
    - name: upload
      use: actions/upload-artifact@v2
      with:
        name: ${{ env.ARTIFICATE_NAME }}
        path: .

  
    
